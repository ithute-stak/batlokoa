name: Flutter UI validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform runners
        run: flutter create . --platforms=android,web --no-pub

      - name: Get dependencies
        run: flutter pub get

      - name: Flutter version
        run: flutter --version

      - name: Analyze
        run: flutter analyze

      - name: Test responsive navigation and app screens
        run: flutter test

      - name: Build web UI
        run: flutter build web --release

      - name: Upload web preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: batlokoa-web-preview
          path: build/web
          retention-days: 7
