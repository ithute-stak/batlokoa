name: Flutter UI validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install gateway test requirements
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Test fail-closed gateway
        run: python -m pytest -q backend/tests

  postgres-link-store:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: batlokoa_test
          POSTGRES_PASSWORD: batlokoa_disposable_ci
          POSTGRES_DB: batlokoa_link_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U batlokoa_test -d batlokoa_link_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BATLOKOA_LINK_TEST_POSTGRES_URL: postgresql://batlokoa_test:batlokoa_disposable_ci@127.0.0.1:5432/batlokoa_link_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Test PostgreSQL link mappings, transactions and revocation
        run: python -m pytest -q backend/tests/test_link_store_postgres.py backend/tests/test_sessions_postgres.py backend/tests/test_oidc_transaction_postgres.py backend/tests/test_staging_schema_preflight_postgres.py

  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform runners
        run: flutter create . --platforms=android,web --no-pub

      - name: Get dependencies
        run: flutter pub get

      - name: Flutter version
        run: flutter --version

      - name: Check Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test responsive navigation and app screens
        run: flutter test

      - name: Build web UI
        run: flutter build web --release

      - name: Package web preview container
        run: docker build -f Dockerfile.web -t batlokoa-web:ci .

      - name: Validate Nginx configuration
        run: docker run --rm batlokoa-web:ci nginx -t

      - name: Smoke-test running web container
        run: bash scripts/smoke_web.sh

      - name: Upload web preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: batlokoa-web-preview
          path: build/web
          retention-days: 7
