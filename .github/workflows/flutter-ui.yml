name: Flutter UI validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install gateway test requirements
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Test fail-closed gateway
        run: python -m pytest -q backend/tests

  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform runners
        run: flutter create . --platforms=android,web --no-pub

      - name: Get dependencies
        run: flutter pub get

      - name: Flutter version
        run: flutter --version

      - name: Check Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test responsive navigation and app screens
        run: flutter test

      - name: Build web UI
        run: flutter build web --release

      - name: Package web preview container
        run: docker build -f Dockerfile.web -t batlokoa-web:ci .

      - name: Validate Nginx configuration
        run: docker run --rm batlokoa-web:ci nginx -t

      - name: Smoke-test running web container
        run: bash scripts/smoke_web.sh

      - name: Upload web preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: batlokoa-web-preview
          path: build/web
          retention-days: 7
