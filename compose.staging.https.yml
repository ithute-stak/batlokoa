# Separate, opt-in HTTPS staging preview. Never use production credentials.
# Certificate/key must be operator-provisioned into the directory below.
# Do not expose API or Flutter container ports directly.
services:
  batlokoa-web-preview:
    image: batlokoa-web:staging-https
    build:
      context: .
      dockerfile: Dockerfile.web
    expose:
      - "8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

  batlokoa-gateway-preview:
    image: batlokoa-gateway:staging-https
    build:
      context: .
      dockerfile: Dockerfile.gateway
    expose:
      - "8000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  batlokoa-edge:
    image: nginx:stable-alpine
    depends_on:
      - batlokoa-web-preview
      - batlokoa-gateway-preview
    ports:
      - "127.0.0.1:${BATLOKOA_STAGING_TLS_PORT:-18443}:8443"
    volumes:
      - ./deploy/nginx.staging-edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ${BATLOKOA_STAGING_TLS_DIR:?Staging TLS certificate directory required}:/etc/nginx/tls:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
